name: daily update

# Every day: fetch the latest Cricsheet ODIs, score finished predictions, lock in
# predictions for matches due tomorrow, refresh the website's ratings, and commit.
# Results Cricsheet hasn't published yet still go in by hand (`cwc27 result`).

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC, before the next day's matches lock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e .
      - run: cwc27 update --download
      - run: cwc27 export-web
      - name: Commit any changes
        run: |
          # A new timestamp alone isn't worth a commit.
          for file in web/data/ratings.json web/data/dashboard.json; do
            if ! git diff -U0 "$file" | grep '^[+-] ' | grep -qv '"generated_at"'; then
              git checkout -- "$file"
            fi
          done
          git add data/predictions_log.csv web/data/ratings.json web/data/dashboard.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: daily update $(date -u +%F)"
          git pull --rebase
          git push
